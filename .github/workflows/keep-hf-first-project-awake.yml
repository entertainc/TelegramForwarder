name: Keep HF first_project Awake

on:
  schedule:
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/keep-hf-first-project-awake.yml"

concurrency:
  group: keep-hf-first-project-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SPACE_URL: https://entertainc-first-project.hf.space/
      HF_KEEPALIVE_TOKEN: ${{ secrets.HF_KEEPALIVE_TOKEN }}
    steps:
      - name: Ping private Space
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${HF_KEEPALIVE_TOKEN}" ]]; then
            echo "::error::HF_KEEPALIVE_TOKEN is required for the private first_project Space"
            exit 1
          fi

          response=$(curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --max-time 45 \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            -H "Authorization: Bearer ${HF_KEEPALIVE_TOKEN}" \
            --output /dev/null \
            --write-out "%{http_code}\n%{url_effective}" \
            "${SPACE_URL}")

          http_status=${response%%$'\n'*}
          effective_url=${response#*$'\n'}
          if [[ "${http_status}" != "200" || "${effective_url}" != "${SPACE_URL}"* ]]; then
            echo "::error::Private Space did not return HTTP 200 on the expected host"
            exit 1
          fi

          echo "first_project -> HTTP ${http_status}"
